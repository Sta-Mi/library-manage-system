<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员图书录入</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', Arial, sans-serif;
      margin: 0; padding: 20px;
      background: linear-gradient(145deg, #f0f6fc 0%, #e0ecf5 100%);
      color: #1a3a4f;
    }
    .management-panel {
      background: #fff;
      border-radius: 28px;
      padding: 1.8rem;
      box-shadow: 0 12px 24px -8px rgba(18,52,77,.08);
      margin-bottom: 16px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .search-box, input, select, button {
      border-radius: 30px;
      border: 1px solid #d5e2ec;
      padding: 10px 14px;
    }
    .btn-primary {
      background: #1e4459;
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .action-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="management-panel">
    <h2>图书录入（管理员）</h2>
    <div class="grid-3" id="formGrid">
      <input id="isbn" placeholder="ISBN" autocomplete="off" />
      <input id="title" placeholder="书名 title" autocomplete="off" />
      <input id="author" placeholder="作者" autocomplete="off" />
      <select id="categorySelect"><option value="">请选择分类</option></select>
      <input id="stock" type="number" placeholder="库存 stock" />
    </div>
    <div class="action-bar">
      <button type="button" id="addBtn" class="btn-primary">录入图书</button>
      <button type="button" id="exportBtn">导出 JSON</button>
      <input id="importInput" type="file" accept=".json,application/json" />
    </div>
  </div>

  <script>
  (function () {
    var API_BASE_URL = 'http://127.0.0.1:8082/api';

    var currentUser = null;
    try {
      currentUser = JSON.parse(sessionStorage.getItem('currentUser') || null);
    } catch (_) {}
    var token = sessionStorage.getItem('accessToken') || '';
    if (!currentUser || currentUser.role !== 'admin') {
      //window.location.href = 'login.html';
      toast('测试模式，直接进入');
      //return;
    }

    async function postJson(path, body) {
      var resp = await fetch(API_BASE_URL + path, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + token
        },
        body: JSON.stringify(body != null ? body : {})
      });
      var text = await resp.text();
      try {
        return JSON.parse(text);
      } catch (_) {
        return { success: false, message: text.slice(0, 120) || '非 JSON 响应' };
      }
    }

    var state = {
      books: [],
      apiCategories: [],
      bookForm: { isbn: '', title: '', author: '', category: '', categoryId: '', stock: null }
    };

    function toast(msg) {
      alert(msg);
    }

    function categoryLabelForBook(categoryId, categoryName) {
      if (categoryName) return String(categoryName);
      var idStr = String(categoryId || '');
      if (!idStr) return '';
      for (var i = 0; i < state.apiCategories.length; i++) {
        var c = state.apiCategories[i];
        var cid = c.id != null ? String(c.id) : String(c.category_id || '');
        if (cid === idStr) return String(c.name || c.title || cid);
      }
      return idStr;
    }

    function extractCategoryListFromResponse(res) {
      var d = res && res.data;
      if (Array.isArray(d)) return d;
      if (d && Array.isArray(d.categories)) return d.categories;
      if (d && Array.isArray(d.list)) return d.list;
      if (d && Array.isArray(d.items)) return d.items;
      if (res && Array.isArray(res.categories)) return res.categories;
      return [];
    }

    function applyCategoryRawListToSelect(raw) {
      if (!Array.isArray(raw)) raw = [];
      state.apiCategories = raw;
      var sel = document.getElementById('categorySelect');
      var keep = state.bookForm.categoryId || '';
      sel.innerHTML = '<option value="">请选择分类</option>';
      raw.forEach(function (c) {
        var id = c.id != null ? String(c.id) : String(c.category_id || '');
        var name = c.name || c.title || id;
        if (id) sel.appendChild(new Option(name, id));
      });
      if (keep && Array.prototype.some.call(sel.options, function (o) { return o.value === keep; })) {
        sel.value = keep;
      }
    }

    async function loadCategoriesFromApi() {
      var res = await postJson('/admin_category_list', {});
      if (res && res.success === false) throw new Error(res.message || '分类加载失败');
      applyCategoryRawListToSelect(extractCategoryListFromResponse(res));
    }

    function fillCategorySelectFallback() {
      var sel = document.getElementById('categorySelect');
      sel.innerHTML = '<option value="">请选择分类</option>';
    }

    async function saveBookToBackendFromForm(f) {
      var qty = f.stock != null && !isNaN(Number(f.stock)) ? Number(f.stock) : 0;
      var cid = parseInt(String(f.categoryId), 10);
      var body = {
        title: f.title,
        author: f.author,
        category_id: isNaN(cid) ? f.categoryId : cid,
        isbn: f.isbn,
        total: qty
      };
      return postJson('/admin_book_create', body);
    }

    function readFormIntoState() {
      var sel = document.getElementById('categorySelect');
      var opt = sel.options[sel.selectedIndex];
      state.bookForm.isbn = document.getElementById('isbn').value.trim();
      state.bookForm.title = document.getElementById('title').value.trim();
      state.bookForm.author = document.getElementById('author').value.trim();
      state.bookForm.categoryId = sel.value;
      state.bookForm.category = (sel.value && opt) ? opt.text : '';
      var sv = document.getElementById('stock').value;
      state.bookForm.stock = sv === '' ? null : Number(sv);
    }

    function applyStateToForm() {
      document.getElementById('isbn').value = state.bookForm.isbn || '';
      document.getElementById('title').value = state.bookForm.title || '';
      document.getElementById('author').value = state.bookForm.author || '';
      document.getElementById('stock').value = state.bookForm.stock != null ? String(state.bookForm.stock) : '';
      document.getElementById('categorySelect').value = state.bookForm.categoryId || '';
    }

    function render() {
      applyStateToForm();
    }

    async function addBook() {
      readFormIntoState();
      var f = state.bookForm;
      if (!f.isbn || !f.title || !f.author) {
        toast('ISBN、书名、作者不能为空');
        return;
      }
      if (!f.categoryId) {
        toast('请选择分类');
        return;
      }
      try {
        var res = await saveBookToBackendFromForm(f);
        if (!res || !res.success) {
          toast((res && res.message) || '录入失败');
          return;
        }
        state.bookForm = { isbn: '', title: '', author: '', category: '', categoryId: '', stock: null };
        toast('图书录入成功');
        render();
      } catch (e) {
        console.error(e);
        toast('网络错误：' + (e && e.message ? e.message : '请检查后端'));
      }
    }

    function exportJson() {
      var booksPayload = state.books.map(function (b) {
        return {
          id: b.id || undefined,
          title: b.title,
          author: b.author,
          category_id: b.category_id || undefined,
          isbn: b.isbn,
          stock: b.stock,
          status: b.status || undefined
        };
      });
      var payload = { books: booksPayload, apiCategories: state.apiCategories };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'library-data.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function importJson(file) {
      if (!file) return;
      var r = new FileReader();
      r.onload = function (e) {
        (async function () {
          try {
            var p = JSON.parse(e.target.result);
            if (Array.isArray(p.apiCategories) && p.apiCategories.length) {
              applyCategoryRawListToSelect(p.apiCategories);
            } else {
              try {
                await loadCategoriesFromApi();
              } catch (_) {
                fillCategorySelectFallback();
              }
            }
            if (Array.isArray(p.books)) {
              state.books = p.books.map(function (raw) {
                var cid = raw.category_id != null ? String(raw.category_id) : '';
                return {
                  id: raw.id != null ? String(raw.id) : '',
                  isbn: String(raw.isbn || ''),
                  title: String(raw.title || ''),
                  author: String(raw.author || ''),
                  cover: raw.cover || '',
                  category_id: cid,
                  categoryLabel: categoryLabelForBook(cid, raw.category_name),
                  stock: raw.stock != null ? Number(raw.stock) : 0,
                  status: raw.status != null ? String(raw.status) : '',
                  active: true
                };
              });
            }
            if (
              confirm('是否在服务端执行 admin_book_batch_import（将上传 JSON 中的 books 数组）')
            ) {
              var items = (p.books || []).map(function (raw) {
                var n =
                  raw.total != null
                    ? Number(raw.total)
                    : raw.stock != null
                      ? Number(raw.stock)
                      : 0;
                var cat = raw.category_id != null ? parseInt(String(raw.category_id), 10) : NaN;
                return {
                  title: raw.title || raw.name,
                  author: raw.author || '',
                  category_id: isNaN(cat) ? raw.category_id : cat,
                  isbn: raw.isbn || '',
                  total: n
                };
              });
              var bir = await postJson('/admin_book_batch_import', { books: items });
              if (bir && bir.success) {
                toast('批量导入已提交');
                try {
                  await loadCategoriesFromApi();
                } catch (_) {}
              } else {
                toast((bir && bir.message) || '批量导入失败');
              }
            } else {
              toast('数据导入成功（仅本地）');
            }
            render();
          } catch (_) {
            toast('数据导入失败：JSON 格式不正确');
          }
        })().catch(function (err) {
          console.error(err);
          toast('导入处理异常');
        });
      };
      r.readAsText(file, 'utf-8');
    }

    document.getElementById('formGrid').addEventListener('input', function () {
      readFormIntoState();
    });
    document.getElementById('categorySelect').addEventListener('change', function () {
      readFormIntoState();
    });

    document.getElementById('addBtn').onclick = function () {
      addBook().catch(function (e) { console.error(e); toast('请求异常'); });
    };
    document.getElementById('exportBtn').onclick = exportJson;
    document.getElementById('importInput').onchange = function (e) {
      importJson(e.target.files[0]);
    };

    (async function init() {
      try {
        await loadCategoriesFromApi();
      } catch (e) {
        console.warn(e);
        toast((e && e.message) || '分类列表加载失败，请检查网络与后端是否提供 POST /api/admin_category_list');
        fillCategorySelectFallback();
      }
      render();
    })();
  })();
  </script>
</body>
</html>
