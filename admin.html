<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员系统 · 墨客</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #f0f6fc 0%, #e0ecf5 100%);
      min-height: 100vh;
      display: flex;
      color: #1a3a4f;
    }
    /* 侧边栏 */
    .sidebar {
      width: 280px;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(16px);
      padding: 2rem 1.2rem;
      border-right: 1px solid rgba(200, 215, 230, 0.3);
      display: flex;
      flex-direction: column;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 0.8rem 2rem;
    }
    .logo i {
      background: #1e4459;
      color: white;
      padding: 12px;
      border-radius: 16px;
      font-size: 1.4rem;
    }
    .logo h2 { font-size: 1.4rem; font-weight: 700; }
    .nav-menu { flex: 1; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      margin: 6px 0;
      border-radius: 16px;
      color: #2d556b;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
    }
    .nav-item i { width: 22px; }
    .nav-item.active {
      background: #1e4459;
      color: white;
      box-shadow: 0 8px 14px rgba(30,68,89,0.2);
    }
    .nav-item:hover:not(.active) { background: rgba(30,68,89,0.08); }
    .user-info {
      padding: 20px 18px;
      border-top: 1px solid #cbdae6;
      margin-top: 20px;
    }
    .btn-logout {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1.5px solid #cbdae6;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }
    /* 主内容区 */
    .main-content {
      flex: 1;
      padding: 2rem 2.5rem;
      overflow-y: auto;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 20px;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: white;
      padding: 1.6rem;
      border-radius: 24px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.02);
    }
    /* 管理面板 */
    .management-panel {
      background: white;
      border-radius: 28px;
      padding: 1.8rem;
      box-shadow: 0 12px 24px -8px rgba(18,52,77,0.08);
    }
    .action-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .filter-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .search-box {
      display: flex;
      background: #f3f9ff;
      border-radius: 40px;
      padding: 4px 4px 4px 20px;
      border: 1px solid #d5e2ec;
    }
    .search-box input, .search-box select {
      border: none;
      background: transparent;
      padding: 10px 8px;
      outline: none;
    }
    .btn-primary {
      background: #1e4459;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 36px;
      font-weight: 600;
      cursor: pointer;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }
    .data-table th {
      text-align: left;
      padding: 1rem 0.8rem;
      color: #3b6079;
      border-bottom: 2px solid #e2ecf3;
    }
    .data-table td {
      padding: 1rem 0.8rem;
      border-bottom: 1px solid #ecf3f9;
    }
    .badge {
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .badge.borrowed { background: #fce9e6; color: #b13e3e; }
    .badge.returned { background: #e3f0e8; color: #1b6b4c; }
    .badge.overdue { background: #fff3cd; color: #856404; }
    .badge.admin { background: #d4e4f0; color: #1a4b6d; }
    .badge.reader { background: #e3f0e8; color: #1b6b4c; }
    .status-toggle {
      width: 48px;
      height: 26px;
      background: #cbdae6;
      border-radius: 30px;
      display: inline-block;
      position: relative;
      cursor: pointer;
    }
    .status-toggle.active { background: #2e8b57; }
    .status-toggle::after {
      content: '';
      width: 20px; height: 20px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 3px; left: 3px;
      transition: 0.2s;
    }
    .status-toggle.active::after { left: 25px; }
    .action-icon {
      margin: 0 6px;
      color: #3f7895;
      cursor: pointer;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      border-radius: 36px;
      padding: 2.2rem;
      width: 420px;
      max-width: 90%;
    }
    .hidden { display: none !important; }
    .pagination { margin-top: 24px; display: flex; gap: 8px; justify-content: center; }
    .book-search-section {
      background: white;
      border-radius: 28px;
      padding: 1.8rem;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
<div class="sidebar">
  <div class="logo">
    <i class="fas fa-user-shield"></i>
    <h2>墨客·管理</h2>
  </div>
  <div class="nav-menu">
    <div class="nav-item" data-page="dashboard"><i class="fas fa-chart-pie"></i> 仪表盘</div>
    <div class="nav-item" data-page="books"><i class="fas fa-book"></i> 图书查询</div>
    <div class="nav-item" data-page="book-entry"><i class="fas fa-square-plus"></i> 图书录入</div>
    <div class="nav-item" data-page="reader-entry"><i class="fas fa-address-card"></i> 读者管理</div>
    <div class="nav-item active" data-page="circulation"><i class="fas fa-right-left"></i> 借阅管理</div>
    <div class="nav-item" data-page="records"><i class="fas fa-clock-rotate-left"></i> 借阅记录查询</div>
    <div class="nav-item" data-page="users"><i class="fas fa-users-gear"></i> 用户管理</div>
    <div class="nav-item" data-page="roles"><i class="fas fa-user-tag"></i> 角色权限</div>
    <div class="nav-item" data-page="fines"><i class="fas fa-file-invoice-dollar"></i> 罚款管理</div>
  </div>
  <div class="user-info">
    <div><i class="far fa-user-circle"></i> <span id="adminName"></span></div>
    <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> 注销</button>
  </div>
</div>

<div class="main-content">
  <!-- 仪表盘视图 -->
  <div id="dashboardView" class="hidden">
    <div class="page-header">
      <h1>仪表盘</h1>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><i class="fas fa-users" style="font-size:2rem;"></i><h2 id="totalUsers">0</h2><p>总用户</p></div>
      <div class="stat-card"><i class="fas fa-book"></i><h2 id="totalBooks">0</h2><p>馆藏</p></div>
      <div class="stat-card"><i class="fas fa-hand-holding"></i><h2 id="borrowedBooks">0</h2><p>借阅中</p></div>
      <div class="stat-card"><i class="fas fa-clock"></i><h2 id="overdueBooks">0</h2><p>逾期</p></div>
    </div>
  </div>

  <!-- 图书查询视图（所有用户相同） -->
  <div id="booksView" class="hidden">
    <div class="page-header">
      <h1><i class="fas fa-search"></i> 图书综合查询</h1>
    </div>
    <div class="book-search-section">
      <div class="search-box" style="width:100%;">
        <i class="fas fa-search"></i>
        <input type="text" id="bookSearchInput" placeholder="搜索书名、作者或分类（模糊，ISBN 请用书目检索）" style="width:100%;">
      </div>
      <table class="data-table" style="margin-top:20px;">
        <thead>
          <tr><th>书名</th><th>作者</th><th>书目ID</th><th>可借数量</th><th>分类</th></tr>
        </thead>
        <tbody id="bookTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 图书录入视图 -->
  <div id="book-entryView" class="hidden">
    <div class="page-header">
      <h1><i class="fas fa-square-plus"></i> 图书录入与管理</h1>
    </div>
    <div class="management-panel" style="padding:0; overflow:hidden;">
      <iframe src="admin-book-entry.html" title="图书录入" style="width:100%; min-height:900px; border:none;"></iframe>
    </div>
  </div>

  <!-- 读者管理视图 -->
  <div id="reader-entryView" class="hidden">
    <div class="page-header">
      <h1><i class="fas fa-address-card"></i> 读者录入与管理</h1>
    </div>
    <div class="management-panel" style="padding:0; overflow:hidden;">
      <iframe src="admin-reader-entry.html" title="读者管理" style="width:100%; min-height:1000px; border:none;"></iframe>
    </div>
  </div>

  <!-- 借阅管理视图 -->
  <div id="circulationView">
    <div class="page-header">
      <h1><i class="fas fa-right-left"></i> 借阅/归还办理</h1>
    </div>
    <div class="management-panel" style="margin-bottom:20px;">
      <h3 style="margin-bottom:12px;">借阅办理</h3>
      <div class="action-bar">
        <input id="borrowUserId" class="search-box" style="padding:10px;" placeholder="读者证号/用户ID">
        <input id="borrowBookId" class="search-box" style="padding:10px;" placeholder="书目ID（book_id）">
        <button class="btn-primary" id="borrowConfirmBtn">一键借阅确认</button>
      </div>
      <div id="borrowUserInfo" style="color:#3b6079;"></div>
    </div>
    <div class="management-panel">
      <h3 style="margin-bottom:12px;">归还办理</h3>
      <div class="action-bar">
        <input id="returnBookId" class="search-box" style="padding:10px;" placeholder="借阅记录ID（borrow_record_id）">
        <button class="btn-primary" id="returnLookupBtn">识别借阅记录</button>
        <button class="btn-primary" id="returnConfirmBtn">确认归还</button>
      </div>
      <div id="returnInfo" style="color:#3b6079;"></div>
    </div>
  </div>

  <!-- 借阅记录查询 -->
  <div id="recordsView" class="hidden">
    <div class="page-header">
      <h1><i class="fas fa-history"></i> 借阅记录查询</h1>
      <button class="btn-primary" id="exportRecordsBtn"><i class="fas fa-download"></i> 导出记录</button>
    </div>
    <div class="management-panel">
      <div class="action-bar">
        <div class="filter-group">
          <select id="userFilter" class="search-box" style="padding:10px 20px;">
            <option value="">全部用户</option>
          </select>
          <select id="statusFilter" class="search-box" style="padding:10px 20px;">
            <option value="">全部状态</option>
            <option value="borrowed">借阅中</option>
            <option value="returned">已归还</option>
            <option value="overdue">逾期</option>
          </select>
          <input type="date" id="dateFrom" class="search-box" style="padding:10px;" placeholder="开始日期">
          <input type="date" id="dateTo" class="search-box" style="padding:10px;" placeholder="结束日期">
        </div>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="recordSearch" placeholder="搜索书名或读者...">
        </div>
      </div>
      <table class="data-table">
        <thead>
          <tr><th>读者</th><th>书名</th><th>借阅日期</th><th>应还日期</th><th>实际归还</th><th>状态</th><th>罚款</th><th>操作</th></tr>
        </thead>
        <tbody id="recordTableBody"></tbody>
      </table>
      <div class="pagination" id="recordPagination"></div>
    </div>
  </div>

  <!-- 用户管理视图 -->
  <div id="usersView" class="hidden">
    <div class="page-header">
      <h1><i class="fas fa-users-gear"></i> 用户管理</h1>
      <button class="btn-primary" id="addUserBtn"><i class="fas fa-plus"></i> 新增用户</button>
    </div>
    <div class="management-panel">
      <div class="action-bar">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchUser" placeholder="搜索用户名或角色...">
        </div>
        <select id="roleFilter" style="padding:10px; border-radius:30px; border:1px solid #d5e2ec;">
          <option value="">全部角色</option>
          <option value="admin">管理员</option>
          <option value="reader">读者</option>
        </select>
      </div>
      <table class="data-table">
        <thead>
          <tr><th>用户名</th><th>角色</th><th>状态</th><th>最后登录</th><th>操作</th></tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>
      <div class="pagination" id="userPagination"></div>
    </div>
  </div>

  <!-- 角色权限视图 -->
  <div id="rolesView" class="hidden">
    <h2>角色权限管理</h2>
    <p style="margin-top:20px;">管理员拥有全部权限，读者仅可修改个人密码和查看个人借阅记录。</p>
  </div>
  <div id="finesView" class="hidden">
    <div class="page-header"><h1><i class="fas fa-file-invoice-dollar"></i> 罚款管理</h1><button class="btn-primary" id="createFineBtn"><i class="fas fa-plus"></i> 新建罚款</button></div>
    <div class="management-panel">
      <div class="action-bar"><div class="filter-group"><input type="number" id="fineUserIdFilter" class="search-box" style="padding:10px;" placeholder="用户ID(可选)"><select id="finePaidFilter" class="search-box" style="padding:10px 20px;"><option value="">全部状态</option><option value="0">未缴</option><option value="1">已缴</option></select></div><button class="btn-primary" id="queryFineBtn">查询罚款</button></div>
      <table class="data-table"><thead><tr><th>ID</th><th>用户ID</th><th>借阅记录ID</th><th>金额</th><th>状态</th><th>备注</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="fineTableBody"></tbody></table>
    </div>
  </div>
</div>

<!-- 用户编辑模态框 -->
<div id="userModal" class="modal hidden">
  <div class="modal-content">
    <h3 id="modalTitle">新增用户</h3>
    <form id="userForm">
      <input type="hidden" id="userId">
      <div style="margin:20px 0;"><label>用户名</label><input id="editUsername" style="width:100%; padding:12px; border-radius:30px; border:1px solid #d5e2ec;" required></div>
      <div style="margin:20px 0;"><label>密码</label><input id="editPassword" type="password" style="width:100%; padding:12px; border-radius:30px;"></div>
      <div style="margin:20px 0;"><label>角色</label>
        <select id="editRole" style="width:100%; padding:12px; border-radius:30px;">
          <option value="reader">读者</option><option value="admin">管理员</option>
        </select>
      </div>
      <div style="display:flex; gap:12px; margin-top:24px;">
        <button type="submit" class="btn-primary" style="flex:1;">保存</button>
        <button type="button" id="cancelModal" style="flex:1; border-radius:36px; border:1px solid #ccc;">取消</button>
      </div>
    </form>
  </div>
</div>

<!-- 注销确认 -->
<div id="logoutModal" class="modal hidden">
  <div class="modal-content" style="width:320px; text-align:center;">
    <i class="fas fa-door-open" style="font-size:2.5rem;"></i>
    <h3>确认注销</h3>
    <div style="display:flex; gap:12px; margin-top:24px;">
      <button id="cancelLogout" style="flex:1; padding:12px;">取消</button>
      <button id="confirmLogout" style="flex:1; padding:12px; background:#1e4459; color:white;">退出</button>
    </div>
  </div>
</div>

<script>
  (function(){
    const API_BASE_URL = 'http://127.0.0.1:8082/api';
    
    const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
    const token = sessionStorage.getItem('accessToken') || '';
    if (!currentUser || currentUser.role !== 'admin') window.location.href = 'login.html';
    async function postJson(path, body) {
      const resp = await fetch(`${API_BASE_URL}${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify(body || {})
      });
      return resp.json();
    }
    const statusTextMap = { 0: 'borrowed', 1: 'returned', 2: 'overdue' };
    const statusCodeMap = { borrowed: 0, returned: 1, overdue: 2 };
    const formatTs = (ts) => ts ? new Date(Number(ts) * 1000).toLocaleDateString('zh-CN') : '-';
    const toUnixString = (dateText, end = false) => {
      if (!dateText) return undefined;
      const date = new Date(`${dateText}T${end ? '23:59:59' : '00:00:00'}`);
      return String(Math.floor(date.getTime() / 1000));
    };

    document.getElementById('adminName').textContent = currentUser.username;
    postJson('/account_manage', {}).then((res)=>{ if(res?.success && res?.data?.user?.username){ document.getElementById('adminName').textContent = res.data.user.username; }}).catch(()=>{});
    
    let users = [];
    let books = [];
    let records = [];
    let fines = [];
    
    let currentRecordPage = 1;
    const pageSize = 8;

    // 导航切换
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', ()=> {
        document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
        item.classList.add('active');
        const page = item.dataset.page;
        ['dashboardView','booksView','book-entryView','reader-entryView','circulationView','recordsView','usersView','rolesView','finesView'].forEach(v =>  
          document.getElementById(v).classList.add('hidden')
        );
        document.getElementById(page+'View').classList.remove('hidden');
        
        if (page==='dashboard') updateStats();
        if (page==='books') renderBookTable();
        if (page==='circulation') renderCirculationPanel();
        if (page==='records') { loadUserFilter(); renderRecordTable(); }
        if (page==='users') renderUserTable();
        if (page==='fines') renderFineTable();
      });
    });

    // 初始化用户筛选下拉框
    function loadUserFilter() {
      const select = document.getElementById('userFilter');
      select.innerHTML = '<option value="">全部用户</option>';
      users.forEach(u => {
        select.innerHTML += `<option value="${u.id}">${u.username} (${u.role==='admin'?'管理员':'读者'})</option>`;
      });
    }

    function updateStats() {
      document.getElementById('totalUsers').textContent = users.length;
      document.getElementById('totalBooks').textContent = books.length;
      document.getElementById('borrowedBooks').textContent = records.filter(r=>r.status==='borrowed').length;
      document.getElementById('overdueBooks').textContent = records.filter(r=>r.status==='overdue').length;
    }
    function getFine(record) {
      if (!record || !record.dueDate) return 0;
      const end = record.returnDate || new Date().toISOString().split('T')[0];
      const overdueDays = Math.max(0, Math.ceil((new Date(end) - new Date(record.dueDate)) / 86400000));
      return overdueDays;
    }

    function mergeBooksById(...lists) {
      const byId = new Map();
      lists.flat().forEach((book) => {
        if (book && book.id != null) byId.set(book.id, book);
      });
      return [...byId.values()].sort((a, b) => Number(a.id) - Number(b.id));
    }

    // 渲染图书表格（get_book_list：title/author/category 等为且关系；单框搜索分别请求后按 id 合并）
    async function renderBookTable() {
      const raw = document.getElementById('bookSearchInput')?.value || '';
      const q = raw.trim();
      const tbody = document.getElementById('bookTableBody');
      if (!tbody) return;

      let list = [];
      const pageRequest = { page: 1, page_size: 100, exact: false };
      try {
        if (!q) {
          const result = await postJson('/get_book_list', pageRequest);
          list = result?.data?.books || [];
        } else {
          const [rTitle, rAuthor, rCategory] = await Promise.all([
            postJson('/get_book_list', { ...pageRequest, title: q }),
            postJson('/get_book_list', { ...pageRequest, author: q }),
            postJson('/get_book_list', { ...pageRequest, category: q })
          ]);
          list = mergeBooksById(rTitle?.data?.books || [], rAuthor?.data?.books || [], rCategory?.data?.books || []);
        }
      } catch (e) {
        console.error(e);
        list = [];
      }

      books = list;
      tbody.innerHTML = list.map(b => `
        <tr>
          <td>${b.title}</td><td>${b.author}</td><td>${b.id ?? '-'}</td>
          <td><span class="badge returned">可借数量：${b.total ?? 0}</span></td>
          <td>${b.category_name || '-'}</td>
        </tr>
      `).join('') || '<tr><td colspan="5" style="text-align:center; padding:40px;">暂无图书</td></tr>';
    }

    // 渲染借阅记录（管理员视图：可筛选用户）
    async function renderRecordTable() {
      const userId = document.getElementById('userFilter').value;
      const status = document.getElementById('statusFilter').value;
      const dateFrom = document.getElementById('dateFrom').value;
      const dateTo = document.getElementById('dateTo').value;
      const search = document.getElementById('recordSearch').value.toLowerCase();
      const result = await postJson('/admin_borrow_record_list', {
        target_user_id: userId ? Number(userId) : undefined,
        status: status ? statusCodeMap[status] : undefined,
        from: toUnixString(dateFrom),
        to: toUnixString(dateTo, true)
      });
      records = (result?.data?.records || []).map(r => ({
        id: r.id,
        userId: String(r.reader_id || ''),
        userName: `用户#${r.reader_id ?? '-'}`,
        bookTitle: r.book_title || '-',
        barcode: r.barcode,
        borrowDate: formatTs(r.borrow_date),
        dueDate: formatTs(r.due_date),
        returnDate: formatTs(r.return_date),
        status: statusTextMap[Number(r.status)] || 'borrowed'
      }));
      let filtered = records.filter(r => {
        if (userId && r.userId !== userId) return false;
        if (status && r.status !== status) return false;
        if (search && !(r.bookTitle.toLowerCase().includes(search) || r.userName.toLowerCase().includes(search))) return false;
        return true;
      });
      
      const totalPages = Math.ceil(filtered.length/pageSize);
      const start = (currentRecordPage-1)*pageSize;
      const pageRecords = filtered.slice(start, start+pageSize);
      
      const tbody = document.getElementById('recordTableBody');
      tbody.innerHTML = pageRecords.map(r => `
        <tr>
          <td>${r.userName}</td><td>${r.bookTitle}</td><td>${r.borrowDate}</td><td>${r.dueDate}</td>
          <td>${r.returnDate || '-'}</td>
          <td><span class="badge ${r.status}">${
            r.status==='borrowed'?'借阅中':r.status==='returned'?'已归还':'逾期'}</span></td>
          <td>¥${getFine(r)}</td>
          <td>
            ${r.status !== 'returned' ? `<i class="fas fa-rotate action-icon" onclick="renewRecord('${r.id}')" title="续借"></i>` : ''}
            ${r.status !== 'returned' ? `<i class="fas fa-check-circle action-icon" onclick="markReturned('${r.id}')" title="标记归还"></i>` : ''}
            ${r.status === 'borrowed' ? `<i class="fas fa-triangle-exclamation action-icon" onclick="noteExpired('${r.id}')" title="标记逾期"></i>` : ''}<i class="fas fa-info-circle action-icon" onclick="viewRecordDetail('${r.id}')"></i>
          </td>
        </tr>
      `).join('');
      
      let pagHtml = '';
      for(let i=1; i<=totalPages; i++) {
        pagHtml += `<button style="padding:8px 16px; border-radius:20px;" onclick="goToRecordPage(${i})">${i}</button>`;
      }
      document.getElementById('recordPagination').innerHTML = pagHtml;
    }

    window.markReturned = async (id) => {
      const record = records.find(r=>String(r.id)===String(id));
      if (!record) return;
      const res = await postJson('/admin_return_book', { borrow_record_id: Number(id) });
      alert(res.message || (res.success ? `归还成功，副本条码：${res?.data?.barcode ?? '-'}` : '归还失败'));
      await renderRecordTable();
      updateStats();
    };
    
    window.viewRecordDetail = (id) => {
      const r = records.find(r=>r.id===id);
      alert(`借阅详情\n读者：${r.userName}\n图书：${r.bookTitle}\n借阅日期：${r.borrowDate}\n应还日期：${r.dueDate}`);
    };
    
    window.goToRecordPage = (page) => { currentRecordPage = page; renderRecordTable(); };
    window.renewRecord = async (id) => {
      const record = records.find(r => r.id === id);
      if (!record || record.status === 'returned') return alert('该记录已归还');
      const due = String(Math.floor(Date.now() / 1000 + 7 * 24 * 3600));
      const res = await postJson('/admin_keep_book', { borrow_record_id: Number(id), due_date: due });
      alert(res.message || (res.success ? '续借成功' : '续借失败'));
      await renderRecordTable();
    };

    let pendingReturnRecordId = null;
    function renderCirculationPanel() {
      const uid = document.getElementById('borrowUserId').value.trim();
      const user = users.find(u => u.id === uid || u.username === uid);
      const borrowedCount = records.filter(r => r.userId === user?.id && r.status !== 'returned').length;
      document.getElementById('borrowUserInfo').innerHTML = user
        ? `当前读者：${user.username}（${user.id}），借阅数量/上限：${borrowedCount}/5`
        : '请输入读者证号查看信息';
    }
    document.getElementById('borrowUserId').addEventListener('input', renderCirculationPanel);

    document.getElementById('borrowConfirmBtn').addEventListener('click', async () => {
      const uid = document.getElementById('borrowUserId').value.trim();
      const bookId = Number(document.getElementById('borrowBookId').value.trim());
      if (!Number(uid) || !bookId) return alert('请输入有效的用户ID和书目ID');
      const due = String(Math.floor(Date.now() / 1000 + 14 * 24 * 3600));
      const res = await postJson('/admin_borrow_book', { target_user_id: Number(uid), book_id: bookId, due_date: due });
      alert(res.message || (res.success ? `借阅办理成功，副本条码：${res?.data?.barcode ?? '-'}` : '借阅办理失败'));
      await renderRecordTable();
      updateStats();
    });

    document.getElementById('returnLookupBtn').addEventListener('click', () => {
      const recordId = document.getElementById('returnBookId').value.trim();
      const record = records.find(r => String(r.id) === recordId && r.status !== 'returned');
      pendingReturnRecordId = record?.id || null;
      if (!record) return document.getElementById('returnInfo').textContent = '未找到进行中或逾期的借阅记录';
      document.getElementById('returnInfo').innerHTML = `借阅记录：#${record.id}，借阅人：${record.userName}，图书：${record.bookTitle}，借阅日期：${record.borrowDate}，应还日期：${record.dueDate}，是否逾期：${new Date(record.dueDate)<new Date()?'是':'否'}，逾期罚款：¥${getFine(record)}`;
    });
    document.getElementById('returnConfirmBtn').addEventListener('click', () => {
      if (!pendingReturnRecordId) return alert('请先识别借阅信息');
      markReturned(pendingReturnRecordId);
      document.getElementById('returnInfo').textContent = '归还完成';
      pendingReturnRecordId = null;
    });

    // 用户管理相关（简化）
    async function refreshUsers() {
      // 当前接口文档未提供“用户列表”接口，这里仅维护本地会话态。
      renderUserTable();
    }
    function renderUserTable() {
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = users.map(u => `
        <tr><td>${u.username}</td><td><span class="badge ${u.role}">${u.role}</span></td>
          <td><div class="status-toggle ${u.status==='active'?'active':''}" onclick="toggleStatus('${u.id}')"></div></td>
          <td>${u.lastLogin||'-'}</td>
          <td><i class="fas fa-edit action-icon" onclick="editUser('${u.id}')"></i>
              <i class="fas fa-key action-icon" onclick="resetPassword('${u.id}')"></i>
              <i class="fas fa-user-slash action-icon" onclick="deleteUser('${u.id}')" title="删除用户"></i></td>
        </tr>
      `).join('');
    }
    
    window.toggleStatus = (id) => {
      const user = users.find(u=>u.id===id);
      if (!user) return;
      postJson('/admin_set_user_state', {
        target_user_id: Number(id),
        enabled: user.status === 'active' ? 0 : 1
      }).then((res) => {
        alert(res.message || (res.success ? '状态更新成功' : '状态更新失败'));
        if (res.success) {
          user.status = user.status==='active'?'inactive':'active';
          renderUserTable();
        }
      });
    };
    window.resetPassword = (id) => {
      const next = prompt('请输入新密码（至少6位）');
      if (!next) return;
      postJson('/admin_change_password', {
        target_user_id: Number(id),
        new_password: next
      }).then((res) => alert(res.message || (res.success ? '密码已重置' : '密码重置失败')));
    };
    window.deleteUser = (id) => {
      if (!confirm(`确认删除用户 ${id} ?`)) return;
      postJson('/admin_delete_user', { target_user_id: Number(id) }).then((res) => {
        alert(res.message || (res.success ? '删除成功' : '删除失败'));
        if (res.success) {
          users = users.filter(u => String(u.id) !== String(id));
          renderUserTable();
        }
      });
    };
    window.editUser = (id) => {
      const u = users.find(x => String(x.id) === String(id));
      document.getElementById('modalTitle').textContent = '编辑用户';
      document.getElementById('userId').value = id;
      document.getElementById('editUsername').value = u?.username || '';
      document.getElementById('editPassword').value = '';
      document.getElementById('editRole').value = (u?.role === 'admin') ? 'admin' : 'reader';
      document.getElementById('userModal').classList.remove('hidden');
    };

    document.getElementById('addUserBtn').addEventListener('click', () => {
      document.getElementById('modalTitle').textContent = '新增用户';
      document.getElementById('userForm').reset();
      document.getElementById('userId').value = '';
      document.getElementById('userModal').classList.remove('hidden');
    });
    document.getElementById('cancelModal').addEventListener('click', () => {
      document.getElementById('userModal').classList.add('hidden');
    });
    document.getElementById('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('userId').value.trim();
      const username = document.getElementById('editUsername').value.trim();
      const password = document.getElementById('editPassword').value.trim();
      const roleText = document.getElementById('editRole').value;
      const role = roleText === 'admin' ? 2 : 1;
      if (!id) {
        const name = prompt('姓名');
        const tel = prompt('电话');
        const email = prompt('邮箱');
        const res = await postJson('/admin_add_user', { username, password, role, name, tel, email });
        alert(res.message || (res.success ? '新增成功' : '新增失败'));
        if (res.success) {
          const nu = res?.data?.user || {};
          users.unshift({ id: String(nu.id || Date.now()), username: nu.username || username, role: roleText, status: 'active', lastLogin: '-' });
          renderUserTable();
          document.getElementById('userModal').classList.add('hidden');
        }
        return;
      }
      const resInfo = await postJson('/admin_edit_user_info', { target_user_id: Number(id), username });
      const resRole = await postJson('/admin_set_user_role', { target_user_id: Number(id), role });
      alert(resRole.message || resInfo.message || ((resInfo.success && resRole.success) ? '保存成功' : '保存失败'));
      if (resInfo.success && resRole.success) {
        const u = users.find(x => String(x.id) === String(id));
        if (u) { u.username = username; u.role = roleText; }
        renderUserTable();
        document.getElementById('userModal').classList.add('hidden');
      }
    });
    async function loadFines() {
      const paidVal = document.getElementById('finePaidFilter')?.value;
      const userIdVal = document.getElementById('fineUserIdFilter')?.value.trim();
      const res = await postJson('/admin_fine_record_list', { target_user_id: userIdVal ? Number(userIdVal) : undefined, paid: paidVal === "" ? undefined : Number(paidVal) });
      fines = res?.data?.fines || [];
    }
    async function renderFineTable() {
      await loadFines();
      const tbody = document.getElementById('fineTableBody');
      tbody.innerHTML = fines.map(f => `<tr><td>${f.id}</td><td>${f.reader_id ?? "-"}</td><td>${f.borrow_record_id ?? "-"}</td><td>¥${f.amount}</td><td>${Number(f.paid)===1?'已缴':'未缴'}</td><td>${f.note || "-"}</td><td>${formatTs(f.create_date)}</td><td>${Number(f.paid)===0?`<button class="btn-primary" style="padding:6px 10px;" onclick="adminPayFine(${f.id})">代缴</button>`:"-"}</td></tr>`).join("");
    }
    window.adminPayFine = async (fineId) => {
      const res = await postJson('/admin_pay_fine', { fine_id: Number(fineId) });
      alert(res.message || (res.success ? "代缴成功" : "代缴失败"));
      await renderFineTable();
    };
    window.noteExpired = async (id) => {
      const res = await postJson('/admin_note_expired', { borrow_record_id: Number(id) });
      alert(res.message || (res.success ? "已标记逾期" : "标记失败"));
      await renderRecordTable();
    };

    // 事件监听
    document.getElementById('bookSearchInput')?.addEventListener('input', () => { renderBookTable(); });
    ['userFilter','statusFilter','dateFrom','dateTo','recordSearch'].forEach(id => {
      document.getElementById(id)?.addEventListener('change', ()=> { currentRecordPage=1; renderRecordTable(); });
      document.getElementById(id)?.addEventListener('input', ()=> { currentRecordPage=1; renderRecordTable(); });
    });

    // 注销
    const modal = document.getElementById('logoutModal');
    document.getElementById('logoutBtn').addEventListener('click', ()=> modal.classList.remove('hidden'));
    document.getElementById('cancelLogout').addEventListener('click', ()=> modal.classList.add('hidden'));
    document.getElementById('confirmLogout').addEventListener('click', ()=>{
      sessionStorage.removeItem('currentUser');
      window.location.href = 'login.html';
    });

    // 初始化
    renderBookTable();
    refreshUsers();
    updateStats();
    loadUserFilter();
    renderCirculationPanel();
    renderRecordTable();
    document.getElementById('queryFineBtn').addEventListener('click', renderFineTable);
    document.getElementById('createFineBtn').addEventListener('click', async () => {
      const target_user_id = Number(prompt('目标用户ID'));
      const amount = Number(prompt('罚款金额（正整数）', '10'));
      if (!target_user_id || !amount || amount <= 0) return;
      const borrow_record_id = Number(prompt('借阅记录ID（可选，填0表示不关联）', '0'));
      const note = prompt('备注（可选）') || undefined;
      const res = await postJson('/admin_create_fine_record', { target_user_id, amount, note, borrow_record_id });
      alert(res.message || (res.success ? `罚款创建成功：#${res?.data?.fine_id ?? '-'}` : '创建失败'));
      await renderFineTable();
    });
  })();
</script>
</body>
</html>
