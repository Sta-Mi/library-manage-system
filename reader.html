<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>读者中心 · 墨客</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f5faff;
      min-height: 100vh;
      display: flex;
    }
    .sidebar {
      width: 260px;
      background: white;
      padding: 2rem 1rem;
      box-shadow: 4px 0 12px rgba(0,0,0,0.02);
    }
    .logo { display: flex; align-items: center; gap: 12px; padding:0 0.8rem 2rem; }
    .logo i { background: #1e4459; color: white; padding: 12px; border-radius: 16px; }
    .nav-item {
      padding: 14px 18px; margin:6px 0; border-radius: 16px;
      display: flex; align-items: center; gap: 14px; cursor: pointer;
    }
    .nav-item.active { background: #1e4459; color: white; }
    .main-content { flex:1; padding: 2rem 2.5rem; }
    .page-header { margin-bottom: 2rem; }
    .search-section {
      background: white; border-radius: 48px; padding: 6px 6px 6px 24px;
      display: flex; border: 1px solid #d5e2ec; margin-bottom: 24px;
    }
    .search-section input { flex:1; border: none; padding: 14px; outline: none; }
    .data-table { width:100%; background: white; border-radius: 24px; padding: 1rem; }
    .data-table th { text-align: left; padding: 1rem; color: #3b6079; }
    .data-table td { padding: 1rem; border-top: 1px solid #ecf3f9; }
    .badge {
      padding: 4px 12px; border-radius: 30px; font-size: 0.8rem; font-weight: 600;
    }
    .badge.borrowed { background: #fce9e6; color: #b13e3e; }
    .badge.returned { background: #e3f0e8; color: #1b6b4c; }
    .badge.overdue { background: #fff3cd; color: #856404; }
    .modal { position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.1); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; }
    .modal-card { background: white; border-radius: 36px; padding:2rem; width:380px; }
    .hidden { display: none !important; }
    .input-field { width:100%; padding:14px; border-radius:30px; border:1px solid #d5e2ec; margin:16px 0; }
    .btn-primary { background: #1e4459; color: white; border: none; padding: 12px 24px; border-radius: 36px; cursor: pointer; }
  </style>
</head>
<body>
<div class="sidebar">
  <div class="logo"><i class="fas fa-book-open"></i><h2>墨客·读者</h2></div>
  <div class="nav-item active" data-page="home"><i class="fas fa-home"></i> 图书查询</div>
  <div class="nav-item" data-page="records"><i class="fas fa-history"></i> 我的借阅</div>
  <a class="nav-item" href="reader-profile.html" style="text-decoration:none; color:inherit;"><i class="fas fa-user-circle"></i> 个人中心</a>
  <button class="nav-item" id="logoutBtn" style="margin-top:40px;"><i class="fas fa-sign-out-alt"></i> 注销</button>
</div>

<div class="main-content">
  <!-- 图书查询视图 -->
  <div id="homeView">
    <div class="page-header"><h1><i class="fas fa-search"></i> 图书综合查询</h1></div>
    <div class="search-section">
      <input type="text" placeholder="搜索书名、作者或ISBN..." id="searchInput">
      <button class="btn-primary"><i class="fas fa-search"></i> 搜索</button>
    </div>
    <table class="data-table">
      <thead><tr><th>书名</th><th>作者</th><th>ISBN</th><th>状态</th><th>位置</th><th>操作</th></tr></thead>
      <tbody id="bookTableBody"></tbody>
    </table>
  </div>

  <!-- 我的借阅记录（仅显示本人） -->
  <div id="recordsView" class="hidden">
    <div class="page-header"><h1><i class="fas fa-history"></i> 我的借阅</h1></div>
    <div style="background:white; border-radius:28px; padding:1.8rem;">
      <div style="display:flex; gap:12px; margin-bottom:12px;">
        <input id="quickBorrowCode" placeholder="扫码/输入图书条码快速借阅" style="flex:1; padding:10px; border-radius:30px; border:1px solid #d5e2ec;">
        <button class="btn-primary" id="quickBorrowBtn">快速借阅</button>
        <input id="quickReturnCode" placeholder="扫码/输入图书条码快速归还" style="flex:1; padding:10px; border-radius:30px; border:1px solid #d5e2ec;">
        <button class="btn-primary" id="quickReturnBtn">快速归还</button>
      </div>
      <div style="display:flex; gap:12px; margin-bottom:20px;">
        <select id="statusFilter" style="padding:10px; border-radius:30px; border:1px solid #d5e2ec;">
          <option value="">全部状态</option>
          <option value="borrowed">借阅中</option>
          <option value="returned">已归还</option>
          <option value="overdue">逾期</option>
        </select>
        <input type="text" id="recordSearch" placeholder="搜索书名..." style="flex:1; padding:10px; border-radius:30px; border:1px solid #d5e2ec;">
      </div>
      <table class="data-table">
        <thead><tr><th>书名</th><th>借阅日期</th><th>应还日期</th><th>实际归还</th><th>状态</th><th>罚款</th><th>操作</th></tr></thead>
        <tbody id="myRecordBody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- 注销确认 -->
<div id="logoutModal" class="modal hidden">
  <div class="modal-card" style="text-align:center;">
    <i class="fas fa-door-open" style="font-size:2.5rem;"></i>
    <h3>确认注销</h3>
    <div style="display:flex; gap:12px; margin-top:24px;">
      <button id="cancelLogout" style="flex:1; padding:12px;">取消</button>
      <button id="confirmLogout" style="flex:1; padding:12px; background:#1e4459; color:white;">退出</button>
    </div>
  </div>
</div>

<script>
  (function(){
    const API_BASE_URL = 'http://127.0.0.1:8082/api';
    
    const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
    const token = sessionStorage.getItem('accessToken') || '';
    if (!currentUser || currentUser.role !== 'reader') window.location.href = 'login.html';
    let books = [];
    let allRecords = [];
    async function postJson(path, body, withToken = true) {
      const headers = { 'Content-Type': 'application/json' };
      if (withToken && token) headers.Authorization = `Bearer ${token}`;
      const resp = await fetch(`${API_BASE_URL}${path}`, { method: 'POST', headers, body: JSON.stringify(body || {}) });
      return resp.json();
    }

    // 导航切换
    document.querySelectorAll('.nav-item[data-page]').forEach(item => {
      item.addEventListener('click', ()=>{
        document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
        item.classList.add('active');
        ['homeView','recordsView'].forEach(v => 
          document.getElementById(v).classList.add('hidden')
        );
        document.getElementById(item.dataset.page+'View').classList.remove('hidden');
        if (item.dataset.page === 'home') renderBooks();
        if (item.dataset.page === 'records') renderMyRecords();
      });
    });

    // 渲染图书
    async function fetchBooks(filter='') {
      const result = await postJson('/get_book_list', { title: filter || undefined, exact: false });
      books = result?.data?.books || [];
      renderBooks();
    }
    function renderBooks() {
      const tbody = document.getElementById('bookTableBody');
      tbody.innerHTML = books.map(b => `
        <tr><td>${b.title}</td><td>${b.author}</td><td>-</td>
          <td><span class="badge returned">可借数量: ${b.total ?? '-'}</span></td>
          <td>${b.category_name || '-'}</td>
          <td>-</td>
        </tr>
      `).join('');
    }

    // 渲染我的借阅记录（仅当前用户）
    async function renderMyRecords() {
      const statusText = document.getElementById('statusFilter').value;
      const statusMap = { borrowed: 0, returned: 1, overdue: 2 };
      const status = statusText ? statusMap[statusText] : undefined;
      const search = document.getElementById('recordSearch').value.toLowerCase();
      const result = await postJson('/borrow_record_list', { status });
      const myRecords = (result?.data?.records || []).filter(r => !search || (r.book_title || '').toLowerCase().includes(search));
      allRecords = myRecords;
      
      const tbody = document.getElementById('myRecordBody');
      tbody.innerHTML = myRecords.map(r => `
        <tr><td>${r.book_title}</td><td>${new Date(Number(r.borrow_date)*1000).toLocaleString()}</td><td>${new Date(Number(r.due_date)*1000).toLocaleString()}</td>
          <td>${r.return_date ? new Date(Number(r.return_date)*1000).toLocaleString() : '-'}</td>
          <td><span class="badge ${Number(r.status)===0?'borrowed':Number(r.status)===1?'returned':'overdue'}">${
            Number(r.status)===0?'借阅中':Number(r.status)===1?'已归还':'逾期'}</span></td>
          <td>-</td>
          <td>
            ${Number(r.status)!==1?`<button class="btn-primary" onclick="renewBook('${r.id}')">续借</button>`:''}
            ${Number(r.status)!==1?`<button class="btn-primary" onclick="returnBookByBarcode('${r.barcode}')">归还</button>`:''}
          </td>
        </tr>
      `).join('') || '<tr><td colspan="7" style="text-align:center; padding:40px;">暂无借阅记录</td></tr>';
    }
    window.returnBookByBarcode = async (barcode) => {
      const res = await postJson('/return_book', { barcode });
      alert(res.message || (res.success ? '归还成功' : '归还失败'));
      await renderMyRecords();
    };
    window.renewBook = async (recordId) => {
      const due = String(Math.floor(Date.now() / 1000 + 7 * 24 * 3600));
      const res = await postJson('/keep_book', { borrow_record_id: Number(recordId), due_date: due });
      alert(res.message || (res.success ? '续借成功' : '续借失败'));
      await renderMyRecords();
    };

    document.getElementById('searchInput').addEventListener('input', e=>fetchBooks(e.target.value));
    document.getElementById('statusFilter')?.addEventListener('change', renderMyRecords);
    document.getElementById('recordSearch')?.addEventListener('input', renderMyRecords);
    document.getElementById('quickBorrowBtn').addEventListener('click', async ()=> {
      const barcode = document.getElementById('quickBorrowCode').value.trim();
      if (!barcode) return;
      const due = String(Math.floor(Date.now() / 1000 + 14 * 24 * 3600));
      const res = await postJson('/borrow_book', { barcode, due_date: due });
      alert(res.message || (res.success ? '借阅成功' : '借阅失败'));
      await renderMyRecords();
    });
    document.getElementById('quickReturnBtn').addEventListener('click', async ()=> {
      const barcode = document.getElementById('quickReturnCode').value.trim();
      if (!barcode) return;
      const res = await postJson('/return_book', { barcode });
      alert(res.message || (res.success ? '归还成功' : '归还失败'));
      await renderMyRecords();
    });


    // 注销
    const modal = document.getElementById('logoutModal');
    document.getElementById('logoutBtn').addEventListener('click', ()=> modal.classList.remove('hidden'));
    document.getElementById('cancelLogout').addEventListener('click', ()=> modal.classList.add('hidden'));
    document.getElementById('confirmLogout').addEventListener('click', ()=>{
      sessionStorage.removeItem('currentUser');
      window.location.href = 'login.html';
    });

    // 初始化
    fetchBooks();
  })();
</script>
</body>
</html>
