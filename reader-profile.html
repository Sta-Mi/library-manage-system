<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 · 墨客</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; } body { font-family:'Inter',sans-serif; background:#f5faff; display:flex; min-height:100vh; }
    .sidebar { width:260px; background:#fff; padding:2rem 1rem; box-shadow:4px 0 12px rgba(0,0,0,.02); }
    .nav-item { padding:14px 18px; margin:6px 0; border-radius:16px; display:flex; gap:14px; text-decoration:none; color:inherit; }
    .nav-item.active { background:#1e4459; color:#fff; } .main-content { flex:1; padding:2rem 2.5rem; }
    .input-field { width:100%; padding:14px; border-radius:30px; border:1px solid #d5e2ec; margin:8px 0; } .btn-primary { background:#1e4459; color:#fff; border:none; padding:12px 24px; border-radius:36px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div style="padding:0 .8rem 2rem; font-weight:700;">墨客·读者</div>
    <a class="nav-item" href="reader.html">图书查询 / 我的借阅</a>
    <a class="nav-item active" href="reader-profile.html">个人中心</a>
    <button class="nav-item" id="logoutBtn" style="margin-top:40px; border:none; background:transparent; cursor:pointer;">注销</button>
  </div>
  <div class="main-content">
    <h2>个人中心（读者）</h2>
    <div style="max-width:760px; margin-top:30px; background:white; border-radius:32px; padding:2rem;">
      <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;">
        <input id="profileId" class="input-field" placeholder="读者编号" disabled><input id="profileName" class="input-field" placeholder="姓名">
        <input id="profileGender" class="input-field" placeholder="性别" disabled><input id="profileType" class="input-field" placeholder="读者类型" disabled>
        <input id="profileEmail" class="input-field" placeholder="邮箱"><input id="profilePhone" class="input-field" placeholder="电话">
      </div>
      <input id="profileAvatarUpload" type="file" accept="image/*" class="input-field">
      <p>最近修改时间：<span id="profileUpdatedAt">-</span></p>
      <p id="avatarWrap" style="display:none;"><img id="avatarPreview" alt="头像预览" style="width:88px; height:88px; border-radius:50%; object-fit:cover;"></p>
      <button type="button" class="btn-primary" id="saveProfileBtn">保存资料</button>
      <button type="button" class="btn-primary" id="changePwdBtn" style="margin-left:10px;">修改密码</button>
      <button type="button" class="btn-primary" id="loadHistoryBtn" style="margin-left:10px;">加载借阅历史</button>
      <pre id="historyBox" style="margin-top:14px; max-height:260px; overflow:auto; background:#f7fbff; padding:10px; border-radius:10px;"></pre>
    </div>
  </div>
<script>
(function () {
  const API_BASE_URL = 'http://127.0.0.1:8082/api';
  const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
  const token = sessionStorage.getItem('accessToken') || '';
  if (!currentUser || currentUser.role !== 'reader') window.location.href='login.html';
  async function postJson(path, body) {
    const resp = await fetch(`${API_BASE_URL}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify(body || {})
    });
    return resp.json();
  }
  async function renderProfile() {
    const res = await postJson('/reader_self_info_get', {});
    const info = res?.data || {};
    document.getElementById('profileId').value = info.reader_id || '-';
    document.getElementById('profileName').value = info.name || '';
    document.getElementById('profileGender').value = '未设置';
    document.getElementById('profileType').value = '普通读者';
    document.getElementById('profileEmail').value = info.email || '';
    document.getElementById('profilePhone').value = info.tel || '';
    document.getElementById('profileUpdatedAt').textContent = new Date().toLocaleString('zh-CN', { hour12: false });
  }
  document.getElementById('profileAvatarUpload').addEventListener('change',()=>{ alert('当前后端接口未提供头像上传，暂不支持。'); });
  document.getElementById('saveProfileBtn').addEventListener('click',async ()=>{
    const payload = {
      name: document.getElementById('profileName').value.trim(),
      tel: document.getElementById('profilePhone').value.trim(),
      email: document.getElementById('profileEmail').value.trim()
    };
    const res = await postJson('/reader_self_info_update', payload);
    alert(res.message || (res.success ? '个人资料已保存' : '保存失败'));
    if (res.success) renderProfile();
  });
  document.getElementById('changePwdBtn').addEventListener('click', async ()=> {
    const old_password = prompt('请输入当前密码');
    const new_password = prompt('请输入新密码');
    if (!old_password || !new_password) return;
    const res = await postJson('/reader_self_password_change', { old_password, new_password });
    alert(res.message || (res.success ? '密码修改成功' : '密码修改失败'));
  });
  document.getElementById('loadHistoryBtn').addEventListener('click', async ()=> {
    const start_date = prompt('开始日期(可空，格式 YYYY-MM-DD)') || undefined;
    const end_date = prompt('结束日期(可空，格式 YYYY-MM-DD)') || undefined;
    const res = await postJson('/reader_self_borrow_history', { start_date, end_date });
    document.getElementById('historyBox').textContent = JSON.stringify(res?.data?.list || [], null, 2);
  });
  document.getElementById('logoutBtn').addEventListener('click',()=>{ sessionStorage.removeItem('currentUser'); window.location.href='login.html'; });
  renderProfile();
})();
</script>
</body>
</html>
